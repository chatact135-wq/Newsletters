<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة تقسيم الخطة الأسبوعية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial; background-color: #f4f7f6; margin: 0; padding: 50px; text-align: center; }
        .container { background-color: white; max-width: 600px; margin: auto; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #003366; }
        input[type="file"] { margin: 30px 0; font-size: 16px; }
        button { padding: 12px 25px; background-color: #003366; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #002244; }
        #loader { display: none; margin-top: 20px; color: #003366; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>أداة التدقيق وتقسيم الخطة الأسبوعية</h2>
        <p>قم برفع ملف الإكسل (Excel). سيقوم النظام أولاً بتدقيق الملف لإخبارك بالمواد والمعلمين المتخلفين عن التسليم، ثم يمكنك استخراج الملفات.</p>
        
        <form action="/upload" method="post" enctype="multipart/form-data" onsubmit="document.getElementById('loader').style.display='block';">
            <input type="file" name="file" accept=".xlsx" required>
            <br>
            <button type="submit">رفع وتدقيق (Upload & Audit)</button>
        </form>
        <div id="loader">جاري تحليل البيانات... يرجى الانتظار ثواني.</div>
    </div>
</body>
</html>
